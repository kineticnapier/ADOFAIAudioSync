name: Export source once

on:
  pull_request:
    branches:
      - main

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Archive source
        run: |
          tar -czf /tmp/ADOFAIAudioSync-source.tar.gz --exclude=.git .
      - uses: actions/upload-artifact@v4
        with:
          name: ADOFAIAudioSync-source
          path: /tmp/ADOFAIAudioSync-source.tar.gz
          if-no-files-found: error

  export-net48-refs:
    runs-on: windows-latest
    steps:
      - name: Stage .NET Framework 4.8 reference assemblies
        shell: pwsh
        run: |
          $src = Join-Path ${env:ProgramFiles(x86)} 'Reference Assemblies\Microsoft\Framework\.NETFramework\v4.8'
          if (-not (Test-Path -LiteralPath $src)) { throw "v4.8 reference assemblies not found: $src" }
          Compress-Archive -Path (Join-Path $src '*') -DestinationPath "$env:RUNNER_TEMP\net48-reference-assemblies.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: net48-reference-assemblies
          path: ${{ runner.temp }}\net48-reference-assemblies.zip
          if-no-files-found: error

  export-harmony:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: newman55/unity-mod-manager
          ref: master
          path: umm
      - name: Restore Lib.Harmony 2.3.6
        shell: pwsh
        run: |
          dotnet restore .\umm\UnityModManager\UnityModManager.csproj
          $harmony = Get-ChildItem "$env:USERPROFILE\.nuget\packages\lib.harmony\2.3.6" -Recurse -Filter 0Harmony.dll | Where-Object { $_.FullName -match 'net4' } | Select-Object -First 1
          if ($null -eq $harmony) { throw '0Harmony.dll was not found after restore' }
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\harmony-ref" | Out-Null
          Copy-Item $harmony.FullName "$env:RUNNER_TEMP\harmony-ref\0Harmony.dll"
      - uses: actions/upload-artifact@v4
        with:
          name: harmony-ref
          path: ${{ runner.temp }}\harmony-ref\0Harmony.dll
          if-no-files-found: error
